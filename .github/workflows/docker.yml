name: Immagine backend

# Pubblica l'immagine del backend su GitHub Container Registry.
# Serve a due cose: aggiornare la VPS senza compilare sulla macchina, e poter
# importare lo stack dall'interfaccia di ZimaOS, che gestisce `image:` ma non
# `build:` (vedi deploy/docker-compose.ghcr.yml).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Token generato per il workflow: nessun segreto da configurare.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Finisce in /health: è così che si verifica che la VPS stia davvero
          # girando l'immagine appena pubblicata.
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La cache di GitHub Actions evita di reinstallare le dipendenze npm
          # a ogni push: senza, ogni build riparte da zero.
          cache-from: type=gha
          cache-to: type=gha,mode=max
