name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Il repository non contiene il Gradle wrapper (il .jar è un binario che
      # va generato in locale): qui Gradle viene installato direttamente.
      # AGP 8.7 richiede almeno Gradle 8.9.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compila l'APK di debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Test unitari
        run: gradle testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Il report resta scaricabile anche quando la build fallisce: senza,
      # l'unico indizio sarebbe l'output troncato nel log.
      # `ignore` e non `error`: se a fallire è la compilazione Kotlin, la
      # cartella dei report non viene nemmeno creata, e un secondo errore
      # nasconderebbe quello vero.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
