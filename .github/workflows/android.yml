name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Serve a creare la release con l'APK allegato.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          # Il versionCode è il conteggio dei commit: con un clone superficiale
          # sarebbe più basso del vero, e Android rifiuterebbe l'aggiornamento
          # scambiandolo per un ritorno a una versione precedente.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Il repository non contiene il Gradle wrapper (il .jar è un binario che
      # va generato in locale): qui Gradle viene installato direttamente.
      # AGP 8.7 richiede almeno Gradle 8.9.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Senza una firma stabile ogni build ha una chiave diversa e il telefono
      # rifiuta di installarla sopra la precedente. La chiave sta nei secret del
      # repository, non nel codice.
      #
      # Nelle pull request dai fork i secret non esistono: lì si compila e basta,
      # con la firma di debug, e non si pubblica nulla.
      - name: Ricostruisci il keystore di firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Nessun keystore configurato: firma di debug, niente release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Numero di versione
        id: version
        run: |
          NAME=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          CODE=$(git rev-list --count HEAD)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-$CODE" >> "$GITHUB_OUTPUT"
          echo "Versione $NAME (build $CODE)"

      - name: Compila l'APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Test unitari
        run: gradle testReleaseUnitTest --no-daemon

      - name: Rinomina l'APK
        id: apk
        run: |
          DEST="app/build/outputs/apk/release/spotify-stats-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=android/$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # La release è il canale di aggiornamento: l'app interroga
      # /releases/latest e confronta il numero in coda al tag.
      #
      # `|| upload --clobber` copre la ri-esecuzione del workflow sullo stesso
      # commit, dove il tag esiste già e `create` fallirebbe.
      - name: Pubblica la release
        if: github.event_name != 'pull_request' && steps.keystore.outputs.signed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          TITLE: Versione ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
        run: |
          gh release create "$TAG" "$APK" --title "$TITLE" --generate-notes \
            || gh release upload "$TAG" "$APK" --clobber

      # Il report resta scaricabile anche quando la build fallisce: senza,
      # l'unico indizio sarebbe l'output troncato nel log.
      # `ignore` e non `error`: se a fallire è la compilazione Kotlin, la
      # cartella dei report non viene nemmeno creata, e un secondo errore
      # nasconderebbe quello vero.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
