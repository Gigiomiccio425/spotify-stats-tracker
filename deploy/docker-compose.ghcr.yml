# Variante che usa l'immagine già compilata su GitHub Container Registry
# invece di compilarla sulla VPS.
#
# Va lanciata da terminale, non importata dalla finestra "app personalizzata"
# di ZimaOS: quella non sostituisce le variabili `${...}` perche' non ha un
# .env da cui leggerle, e fallisce con "Impossibile salvare l'app
# personalizzata". Per ottenere un YAML gia' risolto da incollare li':
#   docker compose -f docker-compose.ghcr.yml --env-file .env config
#
# Prima di usarla serve che il workflow "Immagine backend" abbia pubblicato
# almeno una volta, e che il package su GitHub sia pubblico (Packages →
# backend → Package settings → Change visibility). Se resta privato serve un
# `docker login ghcr.io` sulla VPS con un token che abbia `read:packages`.
#
# Avvio:  docker compose -f docker-compose.ghcr.yml --env-file .env up -d
# Aggiornamento:  docker compose -f docker-compose.ghcr.yml pull && ... up -d

name: spotify-stats

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve POSTGRES_PASSWORD nel .env}
      POSTGRES_DB: ${POSTGRES_DB:-stats}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Nessuna healthcheck, e nessun `condition: service_healthy` sul backend:
    # su alcuni sistemi (ZimaOS) gli exec dentro i container falliscono con
    # "permission denied" e il database risulterebbe eternamente non sano.
    # Ad aspettare Postgres ci pensa il backend, che riprova la connessione.
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE:?serve BACKEND_IMAGE nel .env, es. ghcr.io/utente/repo/backend:latest}
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stats}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stats}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: https://${DOMAIN}/auth/spotify/callback
      APP_BASE_URL: https://${DOMAIN}
      APP_DEEP_LINK: ${APP_DEEP_LINK:-spotifystats://auth}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY}
      CRON_SECRET: ${CRON_SECRET}
      ENABLE_INTERNAL_CRON: "true"
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-15}
      PORT: "8787"
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
  web:
